# Mesure Photo — fabrication automatique de l'application Android (APK).
# À chaque modification de index.html ou du dossier android/, GitHub compile l'application,
# la signe avec la clé du projet, la publie à l'adresse ci-dessous, puis l'essaie sur un
# téléphone virtuel Android 15 (le résultat s'affiche sur la page de téléchargement) :
# https://github.com/lbrasselet-spec/Mesure-Photo/releases/download/apk/Mesure-Photo.apk
# La clé de signature n'est pas dans le dépôt : elle est enregistrée dans le secret GitHub
# MESURE_KEYSTORE_B64 (Settings > Secrets and variables > Actions). Sans ce secret, l'APK compilé
# est une version de contrôle (clé provisoire) et GitHub publie à la place le fichier déjà signé
# déposé dans publication/Mesure-Photo.apk (vérifié : même clé que les versions installées).
name: Application Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', 'publication/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publie: ${{ steps.publier.outputs.publie }}
    steps:
      - uses: actions/checkout@v4

      - name: Outils de compilation Android (paquets Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends aapt android-sdk-platform-23 dalvik-exchange zipalign apksigner python3-pil > /dev/null

      - name: Clé de signature
        shell: bash
        env:
          CLE: ${{ secrets.MESURE_KEYSTORE_B64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$CLE" ]; then
            printf '%s' "$CLE" | tr -d ' \r\n' | base64 -d > android/keystore/mesurephoto.p12
            keytool -list -keystore android/keystore/mesurephoto.p12 -storepass mesurephoto -alias mesurephoto > /dev/null 2>&1 \
              || { echo "::error title=Clé de signature::Le secret MESURE_KEYSTORE_B64 est illisible : recopiez le texte de la clé en entier."; exit 1; }
            echo "SIGNATURE=stable" >> "$GITHUB_ENV"
          else
            echo "SIGNATURE=provisoire" >> "$GITHUB_ENV"
            echo "::notice title=Signature::Secret MESURE_KEYSTORE_B64 absent : compilation de contrôle ; publication du fichier signé déposé dans publication/."
          fi

      - name: Compiler l'APK
        shell: bash
        run: |
          export PAGE=../index.html APK_NAME=Mesure-Photo.apk
          export VERSION_CODE=$(( GITHUB_RUN_NUMBER + 1 )) VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          bash android/build.sh
          cp android/Mesure-Photo.apk .
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Fichier signé déposé (sans secret)
        if: env.SIGNATURE == 'provisoire'
        shell: bash
        run: |
          EMPREINTE=e948504304606c9f29e1bce4b00ac86272bf57c5a9bc6d4e28bca4c3613ddeb8   # certificat de la clé du projet
          if [ -f publication/Mesure-Photo.apk ]; then
            apksigner verify --print-certs publication/Mesure-Photo.apk | grep -q "SHA-256 digest: $EMPREINTE" \
              || { echo "::error title=Publication::publication/Mesure-Photo.apk n'est pas signé avec la clé du projet."; exit 1; }
            cp publication/Mesure-Photo.apk Mesure-Photo.apk
            V=$(aapt dump badging Mesure-Photo.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
            echo "SIGNATURE=deposee" >> "$GITHUB_ENV"
            echo "::notice title=Publication::Fichier déposé publication/Mesure-Photo.apk (version $V), signé avec la clé du projet."
          fi

      - name: Publier l'APK
        id: publier
        if: env.SIGNATURE == 'stable' || env.SIGNATURE == 'deposee'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk > /dev/null 2>&1 || gh release create apk --title "Mesure Photo — application Android" --notes "Application Android à installer sur le téléphone."
          gh release upload apk Mesure-Photo.apk --clobber
          gh release edit apk --notes "Version ${VERSION_NAME} du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M'). Téléchargez Mesure-Photo.apk ci-dessous (Android 10 ou plus récent). Essai automatique sur Android 15 en cours…"
          echo "publie=oui" >> "$GITHUB_OUTPUT"
          echo "::notice::APK publié (version ${VERSION_NAME}) : https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/Mesure-Photo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Mesure-Photo.apk

  # Essai automatique sur un téléphone virtuel Android 15 : installation, démarrage,
  # ouverture puis fermeture de l'appareil photo et de la galerie, recherche de plantages.
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Activer l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Préparer le scénario d'essai
        run: |
          cat > "$RUNNER_TEMP/essai.sh" <<'FIN'
          P=fr.brasselet.mesurephoto
          R=resultats.txt; : > "$R"
          ok() { echo "OK — $1" >> "$R"; }
          ko() { echo "ÉCHEC — $1" >> "$R"; }
          haut() { adb shell dumpsys activity activities | grep -m1 -E "topResumedActivity|mResumedActivity" | sed -E 's/.*\{[^ ]+ [^ ]+ ([^ }]+).*/\1/'; }
          ecran() { adb shell uiautomator dump /sdcard/ui.xml > dump.txt 2>&1; adb shell cat /sdcard/ui.xml > "$1" 2>/dev/null; }
          centre() { grep -o "text=\"$1\"[^>]*bounds=\"[^\"]*\"" "$2" | head -1 | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/' | awk '{print int(($1+$3)/2), int(($2+$4)/2)}'; }
          retour() { for i in 1 2 3; do case "$(haut)" in "$P"*) return;; esac; adb shell input keyevent KEYCODE_BACK; sleep 3; done; }

          adb install -r Mesure-Photo.apk > install.txt 2>&1 && ok "Installation" || ko "Installation : $(tail -1 install.txt)"
          adb logcat -c
          adb shell input keyevent 82
          adb shell am start -W -n "$P/.MainActivity" > start.txt 2>&1
          sleep 15
          adb logcat -d > logcat-debut.txt
          if grep -q "Mesure Photo prête" logcat-debut.txt; then ok "Page de l'appli chargée ($(grep -o 'Mesure Photo prête[^\"]*' logcat-debut.txt | head -1))"; else ko "Page de l'appli non chargée"; fi
          ecran ui1.xml; sleep 4; ecran ui1.xml
          adb exec-out screencap -p > ecran-1-accueil.png
          if grep -q 'Prendre une photo' ui1.xml; then ok "Démarrage : page d'accueil affichée"; else ko "Démarrage : page d'accueil non trouvée ($(haut))"; fi

          C=$(centre 'Prendre une photo' ui1.xml)
          if [ -n "$C" ]; then
            adb shell input tap $C; sleep 8
            T=$(haut); adb exec-out screencap -p > ecran-2-appareil-photo.png
            case "$T" in "$P"*) ko "Appareil photo non ouvert";; *) ok "Appareil photo ouvert ($T)";; esac
            retour
            case "$(haut)" in "$P"*) ok "Retour dans l'appli après l'appareil photo";; *) ko "Retour après l'appareil photo ($(haut))";; esac
          else ko "Bouton « Prendre une photo » introuvable"; fi

          ecran ui2.xml
          C=$(centre 'Choisir dans la galerie' ui2.xml)
          if [ -n "$C" ]; then
            adb shell input tap $C; sleep 6
            T=$(haut); adb exec-out screencap -p > ecran-3-galerie.png
            case "$T" in "$P"*) ko "Galerie non ouverte";; *) ok "Galerie ouverte ($T)";; esac
            retour
            case "$(haut)" in "$P"*) ok "Retour dans l'appli après la galerie";; *) ko "Retour après la galerie ($(haut))";; esac
          else ko "Bouton « Choisir dans la galerie » introuvable"; fi

          sleep 2; adb exec-out screencap -p > ecran-4-fin.png
          adb logcat -d > logcat.txt
          if grep -A2 "FATAL EXCEPTION" logcat.txt | grep -q "Process: $P"; then
            ko "Plantage : $(grep -A6 'FATAL EXCEPTION' logcat.txt | grep -A4 "Process: $P" | tail -3 | tr -s ' ' | tr '\n' ' ' | cut -c1-300)"
          else ok "Aucun plantage de l'appli"; fi
          grep -E "chromium.*(Uncaught|SyntaxError|TypeError|ReferenceError)" logcat.txt | head -5 > js.txt
          if [ -s js.txt ]; then ko "Erreur dans la page : $(sed -n 1p js.txt | cut -c1-250)"; else ok "Aucune erreur JavaScript"; fi
          {
            echo "Démarrage : $(tr '\n' ' ' < start.txt | cut -c1-300)"
            echo "Lecture de l'écran : $(tr '\n' ' ' < dump.txt | cut -c1-200) — $(wc -c < ui1.xml) octets, $(grep -o '<node' ui1.xml | wc -l) éléments"
            echo "Textes lus : $(grep -o 'text="[^"]*"' ui1.xml | sed 's/text="//;s/"$//' | grep -v '^$' | head -15 | tr '\n' '|')"
            echo "Journal de la page : $(grep -E 'CONSOLE|chromium' logcat.txt | tail -6 | cut -c1-220 | tr '\n' '|')"
            echo "Journal de l'appli : $(grep -E "$P|AndroidRuntime" logcat.txt | tail -6 | cut -c1-220 | tr '\n' '|')"
          } > diagnostic.txt
          exit 0
          FIN

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/essai.sh"

      - name: Résultats de l'essai
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIE: ${{ needs.build.outputs.publie }}
        run: |
          [ -s resultats.txt ] || echo "ÉCHEC — essai non réalisé (téléphone virtuel indisponible)" > resultats.txt
          cat resultats.txt
          echo "::notice title=Essai Android 15::$(sed 's/%/%25/g' resultats.txt | awk '{printf "%s%%0A", $0}')"
          if [ "$PUBLIE" = oui ]; then
            V=$(gh release view apk -R "$GITHUB_REPOSITORY" --json body -q .body | sed -n 1p | sed 's/ Essai automatique.*//')
            printf '%s\n\nEssai automatique sur un téléphone virtuel Android 15 :\n%s\n' "$V" "$(sed 's/^/- /' resultats.txt)" > notes.md
            gh release edit apk -R "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          [ -f diagnostic.txt ] && echo "::notice title=Diagnostic::$(sed 's/%/%25/g' diagnostic.txt | awk '{printf "%s%%0A", $0}')"
          # captures d'écran de l'essai, consultables dans la branche « essais » du dépôt
          D="$RUNNER_TEMP/essais"; mkdir -p "$D"; cp ecran-*.png resultats.txt diagnostic.txt ui1.xml "$D/" 2>/dev/null || true
          ( cd "$D" && git init -q -b essais && git add -A \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Essai Android 15 — exécution $GITHUB_RUN_NUMBER" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" essais ) || echo "::warning::Captures d'écran non déposées."
          if grep -q '^ÉCHEC' resultats.txt; then echo "::error title=Essai::Au moins un contrôle a échoué (voir ci-dessus)."; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-android-15
          path: |
            ecran-*.png
            logcat.txt
            resultats.txt
            ui1.xml
